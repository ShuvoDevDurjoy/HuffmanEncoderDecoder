name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package
        run: |
          asset="huff-linux-x86_64"
          mkdir -p "dist/$asset"
          cp huff "dist/$asset/huff"
          tar -C "dist/$asset" -czf "$asset.tar.gz" huff
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huff-linux-x86_64
          path: |
            huff-linux-x86_64.tar.gz
            huff-linux-x86_64.tar.gz.sha256

  publish:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find dist -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --generate-notes
          fi
